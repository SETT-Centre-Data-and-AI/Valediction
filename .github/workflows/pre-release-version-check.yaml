name: Check Version Bump

# ======================================================================= #
# Check Version Bump
# Ensures version is bumped whenever a PR targets the release branch
# in the PUBLIC repo. Checks version from pyproject.toml.
# ======================================================================= #

on:
  pull_request:
    branches: [release]
    types: [opened, reopened, synchronize]

jobs:
  env-config:
    uses: ./.github/workflows/config.yaml

  check-version-bump:
    needs: env-config

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PUBLIC_REPO: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      PYTHON_VERSION: '3.12'

    steps:
    - name: Show PR context
      run: |
        echo "Repo:          $GITHUB_REPOSITORY"
        echo "Base branch:   ${{ github.base_ref }}"
        echo "Head branch:   ${{ github.head_ref }}"
        echo "Base SHA:      ${{ github.event.pull_request.base.sha }}"
        echo "Head SHA:      ${{ github.event.pull_request.head.sha }}"

    - name: Checkout PR head
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check version bumped vs release
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "Comparing pyproject.toml version between:"
        echo "  Base (release): $BASE_SHA"
        echo "  Head (PR):      $HEAD_SHA"

        python - << 'PY'
        import os
        import subprocess
        import sys

        BASE_SHA = os.environ["BASE_SHA"]

        def load_pyproject_version_from_rev(rev: str) -> str:
            """Return [project].version from pyproject.toml at given git rev."""
            try:
                contents = subprocess.check_output(
                    ["git", "show", f"{rev}:pyproject.toml"],
                    text=True,
                )
            except subprocess.CalledProcessError:
                print(f"ERROR: Could not read pyproject.toml from rev {rev}", file=sys.stderr)
                sys.exit(1)

            try:
                import tomllib  # Python 3.11+
            except ImportError:
                import tomli as tomllib  # fallback if needed

            data = tomllib.loads(contents)
            try:
                return data["project"]["version"]
            except KeyError:
                print(
                    "ERROR: Could not find [project].version in pyproject.toml.",
                    file=sys.stderr,
                )
                sys.exit(1)

        def load_head_version() -> str:
            """Read version from pyproject.toml in current working tree."""
            try:
                import tomllib
            except ImportError:
                import tomli as tomllib

            try:
                with open("pyproject.toml", "rb") as f:
                    data = tomllib.load(f)
            except FileNotFoundError:
                print("ERROR: pyproject.toml not found in working directory.", file=sys.stderr)
                sys.exit(1)

            try:
                return data["project"]["version"]
            except KeyError:
                print(
                    "ERROR: Could not find [project].version in pyproject.toml.",
                    file=sys.stderr,
                )
                sys.exit(1)

        base_version = load_pyproject_version_from_rev(BASE_SHA)
        head_version = load_head_version()

        print(f"Base (release) version: {base_version}")
        print(f"Head (PR) version:     {head_version}")

        if base_version == head_version:
            print(
                f"ERROR: Version has not been bumped (still {head_version}). "
                "You probably need to run 'cz bump'.",
                file=sys.stderr,
            )
            sys.exit(1)

        print(f"✅ Version bump detected: {base_version} → {head_version}")
        PY
