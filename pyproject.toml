[project]
name = "valediction"
version = "1.7.5"
description = "Valediction is a convenience data validation package that allows generation, import, and constraint enforcement of user-defined data dictionaries against datasets."
authors = [{ name = "Cai Davis", email = "Cai.Davis@uhs.nhs.uk" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas>=2.2.1,<3",
    "requests>=2.31.0,<3",
    "mohawk>=1.1.0,<2",
    "certifi>=2024.2.2,<2027",
    "openpyxl>=3.1.5,<4",
    "xlsxwriter>=3.2.3,<4",
    "pydantic>=2.13.4,<3",
    "tabulate>=0.10.0,<0.11",
    "tqdm>=4.68.2,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "commitizen>=4.16.3,<5",
    "python-dotenv>=1.2.2,<2",
    "mypy>=2.1.0,<3",
    "types-openpyxl (>=3.1.5.20260518,<4.0.0.0)",
    "types-tqdm (>=4.68.0.20260608,<5.0.0.0)",
    "pandas-stubs (>=2.3.2.250827,<4.0.0.0)",
    "pre-commit>=4.6.0,<5",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/valediction",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/valediction",
]

[tool.hatch.build.targets.wheel.sources]
"src/valediction" = "valediction"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$major.$minor.$patch$prerelease"
version_type = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false
